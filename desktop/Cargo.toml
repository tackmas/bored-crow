[package]
name = "desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
directories = "6.0.0"
futures = "0.3.32"
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
rkyv = "0.8.16"
screen_size = "0.1.0"
serde = "1.0.228"
serde_json = "1.0.149"
sysinfo = "0.37.2"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"]}
qsu = { version = "0.10.1", features = ["clap", "installer", "tokio"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
applications = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
app-finder = "=0.1.0"
installed = "0.1.0"
windows = { 
    version = "0.62.2", 
    features = [
        "Win32_Foundation", 
        "Win32_Graphics_Gdi", 
        "Win32_System_LibraryLoader", 
        "Win32_UI_WindowsAndMessaging"
    ] 
}
winreg = "0.55.0"